<svg fill="none" viewBox="0 0 600 400" width="600" height="400" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* {
					margin: 0;
					padding: 0;
					box-sizing: border-box;
				}

				.body {
					height: 300px;
					width: 100%;
					display: flex;
					align-items: center;
					justify-content: center;
					position: relative;
					overflow: hidden;
					background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
					perspective: 1000px;
					font-family: Comic Sans MS, Comic Sans, cursive;
					border: 24px solid #0d1117;
				}

				/* 3D Scene Container */
				.scene-3d {
					position: absolute;
					top: 0;
					left: 0;
					width: 100%;
					height: 100%;
					transform-style: preserve-3d;
					animation: sceneRotate 30s infinite linear;
				}

				/* 3D Text Container */
				.text-3d-container {
					position: absolute;
					top: 20%;
					left: 30%;
					margin: auto;
					text-align: center;
					transform-style: preserve-3d;
					animation: float 6s ease-in-out infinite;
				}

				/* Main 3D Text */
				.text-3d {
					position: relative;
					font-size: 2rem;
					font-weight: 900;
					color: #fff;
					text-transform: uppercase;
					letter-spacing: 0.1em;
					transform-style: preserve-3d;
					animation: textRotate 20s infinite linear;
				}

				/* Create 3D depth effect with multiple layers */
				.text-3d span {
					position: absolute;
					top: 0;
					left: 0;
					transform-style: preserve-3d;
				}

				/* Layer each letter with depth */
				.text-3d span:nth-child(1) {
					transform: translateZ(0px);
					color: #fff;
					text-shadow: 0 0 20px rgba(100,255,255,0.8);
				}

				.text-3d span:nth-child(2) {
					transform: translateZ(-2px);
					color: #f0f0f0;
				}

				.text-3d span:nth-child(3) {
					transform: translateZ(-4px);
					color: #e0e0e0;
				}

				.text-3d span:nth-child(4) {
					transform: translateZ(-4px);
					color: #e0e0e0;
				}

				.text-3d span:nth-child(5) {
					transform: translateZ(-4px);
					color: #e0e0e0;
				}

				/* Floating 3D Cubes */
				.cube {
					position: absolute;
					width: 40px;
					height: 40px;
					transform-style: preserve-3d;
					animation: cubeFloat 8s infinite ease-in-out;
				}

				.cube-face {
					position: absolute;
					width: 40px;
					height: 40px;
					background: rgba(255, 255, 255, 0.1);
					border: 1px solid rgba(255, 255, 255, 0.3);
					backdrop-filter: blur(5px);
				}

				.cube-face.front  { transform: translateZ(20px); }
				.cube-face.back   { transform: translateZ(-20px) rotateY(180deg); }
				.cube-face.right  { transform: rotateY(90deg) translateZ(20px); }
				.cube-face.left   { transform: rotateY(-90deg) translateZ(20px); }
				.cube-face.top    { transform: rotateX(90deg) translateZ(20px); }
				.cube-face.bottom { transform: rotateX(-90deg) translateZ(20px); }

				/* Position cubes around the scene */
				.cube:nth-child(1) {
					top: 20%;
					left: 10%;
					animation-delay: 0s;
				}

				.cube:nth-child(2) {
					top: 60%;
					left: 80%;
					animation-delay: -2s;
				}

				.cube:nth-child(3) {
					top: 80%;
					left: 30%;
					animation-delay: -4s;
				}

				.cube:nth-child(4) {
					top: 30%;
					left: 70%;
					animation-delay: -6s;
				}

				.cube:nth-child(5) {
					top: 50%;
					left: 20%;
					animation-delay: -1s;
				}

				.cube:nth-child(6) {
					top: 15%;
					left: 85%;
					animation-delay: -3s;
				}

				/* Particles */
				.particle-3d {
					position: absolute;
					width: 4px;
					height: 4px;
					background: white;
					border-radius: 50%;
					box-shadow: 0 0 10px rgba(255,255,255,0.8);
				}

				.particle-3d:nth-child(7) {
					top: 25%;
					left: 15%;
					animation: particleFloat1 5s infinite ease-in-out;
				}

				.particle-3d:nth-child(8) {
					top: 45%;
					left: 85%;
					animation: particleFloat2 6s infinite ease-in-out;
				}

				.particle-3d:nth-child(9) {
					top: 65%;
					left: 25%;
					animation: particleFloat3 7s infinite ease-in-out;
				}

				.particle-3d:nth-child(10) {
					top: 75%;
					left: 75%;
					animation: particleFloat1 5.5s infinite ease-in-out;
				}

				.particle-3d:nth-child(11) {
					top: 35%;
					left: 45%;
					animation: particleFloat2 6.5s infinite ease-in-out;
				}

				.particle-3d:nth-child(12) {
					top: 55%;
					left: 55%;
					animation: particleFloat3 7.5s infinite ease-in-out;
				}

				/* Info section */
				.info-container {
					width: 100%;
					position: absolute;
					bottom: 10px;
					left: 50%;
					transform: translateX(-50%);
					z-index: 100;
					text-align: center;
				}

				.info-text {
					color: white;
					font-size: 1rem;
					font-weight: 700;
					margin: 5px 0;
					text-transform: uppercase;
					text-shadow: 1px 1px #6495ED;
					letter-spacing: 0.1em;
				}

				.highlight-text {
					color: #40E0D0;
					text-shadow: 1px 1.5px white;
				}

				.info-links {
					margin-top: 10px;
				}

				.info-links a {
					color: #6495ED;
					text-decoration: none;
					margin: 0 10px;
					font-size: 0.9rem;
					font-weight: 700;
					text-shadow: 1px 1px white;
					transition: color 0.3s;
				}

				.info-links a:hover {
					color: white;
					text-decoration: underline;
				}

				/* Animations */
				@keyframes sceneRotate {
					0% {
						transform: rotateY(0deg) rotateX(0deg);
					}
					100% {
						transform: rotateY(360deg) rotateX(360deg);
					}
				}

				@keyframes textRotate {
					0% {
						transform: translate(-50%, -50%) rotateY(0deg) rotateX(0deg);
					}
					25% {
						transform: translate(-50%, -50%) rotateY(90deg) rotateX(10deg);
					}
					50% {
						transform: translate(-50%, -50%) rotateY(180deg) rotateX(0deg);
					}
					75% {
						transform: translate(-50%, -50%) rotateY(270deg) rotateX(-10deg);
					}
					100% {
						transform: translate(-50%, -50%) rotateY(360deg) rotateX(0deg);
					}
				}

				@keyframes float {
					0%, 100% {
						transform: translateY(0px);
					}
					50% {
						transform: translateY(-5px);
					}
				}

				@keyframes cubeFloat {
					0%, 100% {
						transform: translateY(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
					}
					33% {
						transform: translateY(-30px) rotateX(120deg) rotateY(120deg) rotateZ(120deg);
					}
					66% {
						transform: translateY(15px) rotateX(240deg) rotateY(240deg) rotateZ(240deg);
					}
				}

				@keyframes particleFloat1 {
					0%, 100% {
						transform: translate(0, 0) scale(1);
						opacity: 0.6;
					}
					25% {
						transform: translate(20px, -30px) scale(1.5);
						opacity: 1;
					}
					50% {
						transform: translate(-10px, -50px) scale(0.8);
						opacity: 0.4;
					}
					75% {
						transform: translate(30px, -20px) scale(1.2);
						opacity: 0.8;
					}
				}

				@keyframes particleFloat2 {
					0%, 100% {
						transform: translate(0, 0) scale(1);
						opacity: 0.7;
					}
					33% {
						transform: translate(-25px, 40px) scale(1.6);
						opacity: 0.9;
					}
					66% {
						transform: translate(15px, 20px) scale(0.9);
						opacity: 0.5;
					}
				}

				@keyframes particleFloat3 {
					0%, 100% {
						transform: translate(0, 0) scale(1);
						opacity: 0.8;
					}
					50% {
						transform: translate(-30px, 35px) scale(1.4);
						opacity: 0.3;
					}
				}

				@media (prefers-reduced-motion) {
					.scene-3d, .text-3d, .cube, .particle-3d {
						animation: none !important;
					}
				}
			</style>

			<!-- HTML -->
			<div class='body'>
				<div class="scene-3d">
					<!-- 3D Text -->
					<div class="text-3d-container">
						<div class="text-3d">
							<span>DERIS O'MALLEY</span>
							<span>DERIS O'MALLEY</span>
							<span>DERIS O'MALLEY</span>
							<span>DERIS O'MALLEY</span>
							<span>DERIS O'MALLEY</span>
						</div>
					</div>

					<!-- Floating 3D Cubes -->
					<div class="cube">
						<div class="cube-face front"></div>
						<div class="cube-face back"></div>
						<div class="cube-face right"></div>
						<div class="cube-face left"></div>
						<div class="cube-face top"></div>
						<div class="cube-face bottom"></div>
					</div>

					<div class="cube">
						<div class="cube-face front"></div>
						<div class="cube-face back"></div>
						<div class="cube-face right"></div>
						<div class="cube-face left"></div>
						<div class="cube-face top"></div>
						<div class="cube-face bottom"></div>
					</div>

					<div class="cube">
						<div class="cube-face front"></div>
						<div class="cube-face back"></div>
						<div class="cube-face right"></div>
						<div class="cube-face left"></div>
						<div class="cube-face top"></div>
						<div class="cube-face bottom"></div>
					</div>

					<div class="cube">
						<div class="cube-face front"></div>
						<div class="cube-face back"></div>
						<div class="cube-face right"></div>
						<div class="cube-face left"></div>
						<div class="cube-face top"></div>
						<div class="cube-face bottom"></div>
					</div>

					<div class="cube">
						<div class="cube-face front"></div>
						<div class="cube-face back"></div>
						<div class="cube-face right"></div>
						<div class="cube-face left"></div>
						<div class="cube-face top"></div>
						<div class="cube-face bottom"></div>
					</div>

					<div class="cube">
						<div class="cube-face front"></div>
						<div class="cube-face back"></div>
						<div class="cube-face right"></div>
						<div class="cube-face left"></div>
						<div class="cube-face top"></div>
						<div class="cube-face bottom"></div>
					</div>

					<!-- Floating Particles -->
					<div class="particle-3d"></div>
					<div class="particle-3d"></div>
				</div>

				<!-- Info Section -->
				<div class="info-container">
					<div class="info-text">Web Developer @ <span class="highlight-text">The Leahy Center</span></div>
					<div class="info-text">3rd Year CS @ <span class="highlight-text">Champlain College</span></div>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>